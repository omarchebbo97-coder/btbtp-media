name: drive-pull
on:
  push:
    paths: ['jobs/drive_pull.txt', '.github/workflows/drive_pull.yml']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download from Drive
        run: |
          mkdir -p video/tiktok_best
          while read n id; do
            [ -z "$n" ] && continue
            curl -sSL -o "video/tiktok_best/$n.mp4" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            file "video/tiktok_best/$n.mp4"
          done < jobs/drive_pull.txt
      - name: Transcribe
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper
          python tools/transcribe.py
      - name: Commit
        run: |
          git config user.name "btbtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add video/tiktok_best
          git commit -m "Pull top TikTok videos from Drive + transcripts"
          git pull --rebase
          git push
