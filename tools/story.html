<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Source Sans 3';src:url(node_modules/@fontsource/source-sans-3/files/source-sans-3-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:'Source Sans 3';src:url(node_modules/@fontsource/source-sans-3/files/source-sans-3-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:'Readex Pro';src:url(node_modules/@fontsource/readex-pro/files/readex-pro-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:'Readex Pro';src:url(node_modules/@fontsource/readex-pro/files/readex-pro-arabic-600-normal.woff2);font-weight:600}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#2b2f36}
.bg{position:absolute;inset:-60px;background:center/cover;filter:blur(40px) brightness(.55)}
.img{position:absolute;left:0;right:0;top:0;bottom:0;background:center 62%/1080px auto no-repeat}
.top{position:absolute;left:80px;right:80px;top:230px;background:rgba(61,88,108,.94);border-radius:36px;padding:44px 50px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.eb{font:600 26px 'Source Sans 3';letter-spacing:.16em;color:#E8C269;text-transform:uppercase;margin-bottom:22px}
.ar{font-family:'Readex Pro';direction:rtl}
.h{font-weight:600;font-size:60px;line-height:1.45;color:#fff}
.sub{font-size:38px;color:#E8C269;margin-top:12px;line-height:1.5}
.en{font:600 32px/1.4 'Source Sans 3';color:#fff;margin-top:18px}
.q{position:absolute;left:80px;right:80px;bottom:150px;background:#f2f2f0;border-radius:32px;padding:30px 40px;text-align:center}
.q .ar{font-weight:600;font-size:42px;color:#2d3e4c;line-height:1.45}
.q .e{font:600 28px 'Source Sans 3';color:#3d586c;margin-top:6px}
.h2{position:absolute;bottom:60px;width:100%;text-align:center;font:600 26px 'Source Sans 3';color:#fff}
</style></head><body><script>
const s=JSON.parse(decodeURIComponent(location.hash.slice(1)));const e=t=>String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
document.body.innerHTML=`<div class="bg" style="background-image:url(${s.photo})"></div><div class="img" style="top:${s.dy||0}px;bottom:${-(s.dy||0)}px;background-image:url(${s.photo});background-position:center ${s.pos||'62%'}"></div>
<div class="top"><div class="eb">${e(s.eyebrow)}</div><div class="ar h">${e(s.ar)}</div>${s.ar2?`<div class="ar sub">${e(s.ar2)}</div>`:''}<div class="en">${e(s.en)}</div></div>
<div class="q"><div class="ar">${e(s.qar)}</div><div class="e">${e(s.qen)}</div></div><div class="h2">@omar_organtransplants</div>`;
</script></body></html>
