<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Source Serif 4';src:url(node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-opsz-normal.woff2);font-weight:200 900}
@font-face{font-family:'Source Sans 3';src:url(node_modules/@fontsource/source-sans-3/files/source-sans-3-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:'Readex Pro';src:url(node_modules/@fontsource/readex-pro/files/readex-pro-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:'Readex Pro';src:url(node_modules/@fontsource/readex-pro/files/readex-pro-arabic-600-normal.woff2);font-weight:600}
*{margin:0;box-sizing:border-box}body{margin:0}
.s{position:relative;overflow:hidden;background:#d9a49a center/cover no-repeat}
.panel{position:absolute;left:60px;right:60px;background:rgba(61,88,108,.93);border-radius:34px;padding:38px 44px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.ar{font-family:'Readex Pro',sans-serif;direction:rtl;text-align:right;color:#fff}
.en{font-family:'Source Serif 4',serif;color:#fff}
.sub{color:#E8C269}
.lab{position:absolute;font-family:'Source Sans 3',sans-serif;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#fff;font-size:24px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
</style></head><body><div id="root"></div><script>
const s=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const W=s.w,H=s.h,AF=new URLSearchParams(location.search).get('t')==='tiktok';
const esc=t=>String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const hook=s.type==='hook';
const L=(AF?s.ar:s.en||'').length;
const big=hook?(AF?66:72):(L<=40?(AF?54:60):L<=80?(AF?48:52):(AF?42:46));
const small=hook?(AF?34:36):(AF?30:32);
const main=AF?`<div class="ar" style="font-size:${big}px;line-height:1.45;font-weight:${hook?600:400}">${esc(s.ar)}</div>`:`<div class="en" style="font-size:${big}px;line-height:1.15;${hook?'font-weight:600;':''}">${esc(s.en)}</div>`;
const sec=AF?`<div class="en sub" style="font-size:${small}px;line-height:1.35">${esc(s.en)}</div>`:`<div class="ar sub" style="font-size:${small}px;line-height:1.55">${esc(s.ar)}</div>`;
const TOP=AF?300:Math.round(H*0.06);
document.getElementById('root').innerHTML=`<div class="s" style="width:${W}px;height:${H}px;background-image:url(${s.photo});background-position:center ${s.pos||'70%'}">
${s.eyebrow?`<div class="lab" style="left:72px;top:${TOP-50}px">${esc(s.eyebrow)}</div>`:''}
<div class="panel" style="top:${TOP}px;${AF?'right:150px;':''}">${main}${sec}</div>
<div class="lab" style="right:${AF?160:60}px;bottom:${AF?440:40}px;font-size:22px;letter-spacing:.05em;text-transform:none">@omar_organtransplants</div></div>`;
</script></body></html>
